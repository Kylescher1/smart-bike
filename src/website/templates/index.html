<!DOCTYPE html>
<html>
<head>
    <title>Smart Dashboard</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f4f4f4; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1em; padding: 1em; }
        .card { background: white; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.2); padding: 1em; }
        img { width: 100%; border-radius: 10px; }
    </style>
</head>
<body>
    <h1 style="text-align:center;">Smart Dashboard</h1>
    <div class="grid">
        <div class="card">
            <h2>Live Graph</h2>
            <img id="plot" src="">
        </div>
        <div class="card">
            <h2>Video Stream</h2>
            <img src="/video_feed">
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="/static/dashboard.js"></script>
</body>
</html>
