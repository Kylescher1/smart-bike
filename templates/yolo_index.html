<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YOLO Object Detection Stream</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #1a1a1a;
            color: #ffffff;
            padding: 0;
            margin: 0;
            overflow-x: hidden;
        }
        
        .container {
            padding: 10px;
        }
        
        .header {
            text-align: center;
            padding: 15px 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            margin-bottom: 15px;
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 700;
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 5px;
        }
        
        .video-container {
            width: 100%;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            position: relative;
        }
        
        .video-container img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .controls {
            background: #2a2a2a;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        .control-group:last-child {
            margin-bottom: 0;
        }
        
        .control-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #ccc;
        }
        
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .slider {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: #444;
            outline: none;
            -webkit-appearance: none;
        }
        
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }
        
        .slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
        }
        
        .slider-value {
            min-width: 50px;
            text-align: right;
            font-size: 14px;
            color: #fff;
        }
        
        .btn {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
        }
        
        .btn-success {
            background: #2ecc71;
            color: white;
        }
        
        .btn-success:hover {
            background: #27ae60;
        }
        
        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        
        .btn-danger:hover {
            background: #c0392b;
        }
        
        .stats {
            background: #2a2a2a;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .stat-item {
            text-align: center;
            padding: 10px;
            background: #333;
            border-radius: 8px;
        }
        
        .stat-label {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: #667eea;
        }
        
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }
        
        .status-online {
            background: #2ecc71;
            box-shadow: 0 0 10px #2ecc71;
        }
        
        .status-offline {
            background: #e74c3c;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 YOLO Object Detection</h1>
            <p>Real-time Detection & Tracking</p>
        </div>
        
        <div class="video-container">
            <img src="{{ url_for('video_feed') }}" alt="Video Stream">
        </div>
        
        <div class="stats">
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-label">FPS</div>
                    <div class="stat-value" id="fps">0.0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Inference</div>
                    <div class="stat-value" id="inference">0ms</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Detections</div>
                    <div class="stat-value" id="detections">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Tracks</div>
                    <div class="stat-value" id="tracks">0</div>
                </div>
            </div>
        </div>
        
        <div class="controls">
            <div class="control-group">
                <label class="control-label">Confidence Threshold</label>
                <div class="slider-container">
                    <input type="range" min="0" max="100" value="25" class="slider" id="confSlider">
                    <span class="slider-value" id="confValue">0.25</span>
                </div>
            </div>
            
            <div class="control-group">
                <button class="btn btn-primary" id="toggleTracking">Toggle Tracking</button>
            </div>
            
            <div class="control-group">
                <button class="btn btn-success" id="restartCamera">Restart Camera</button>
            </div>
        </div>
    </div>
    
    <script>
        // Update stats every second
        function updateStats() {
            fetch('/get_stats')
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        document.getElementById('fps').textContent = data.fps.toFixed(1);
                        document.getElementById('inference').textContent = data.inference_time_ms.toFixed(1) + 'ms';
                        document.getElementById('detections').textContent = data.num_detections;
                        document.getElementById('tracks').textContent = data.num_tracks;
                    }
                })
                .catch(error => console.error('Error fetching stats:', error));
        }
        
        // Update stats every second
        setInterval(updateStats, 1000);
        updateStats(); // Initial update
        
        // Confidence threshold slider
        const confSlider = document.getElementById('confSlider');
        const confValue = document.getElementById('confValue');
        
        confSlider.addEventListener('input', function() {
            const value = (this.value / 100).toFixed(2);
            confValue.textContent = value;
        });
        
        confSlider.addEventListener('change', function() {
            const threshold = parseFloat(this.value / 100);
            fetch('/set_conf_threshold', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ threshold: threshold })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    console.log('Confidence threshold updated to', data.threshold);
                }
            })
            .catch(error => console.error('Error setting threshold:', error));
        });
        
        // Toggle tracking
        document.getElementById('toggleTracking').addEventListener('click', function() {
            fetch('/toggle_tracking', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    const status = data.track_enabled ? 'ON' : 'OFF';
                    this.textContent = `Tracking: ${status}`;
                    console.log('Tracking', status);
                }
            })
            .catch(error => console.error('Error toggling tracking:', error));
        });
        
        // Restart camera
        document.getElementById('restartCamera').addEventListener('click', function() {
            if (confirm('Restart camera? This may cause a brief interruption.')) {
                fetch('/restart_camera', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        alert('Camera restarted successfully');
                    } else {
                        alert('Error: ' + data.message);
                    }
                })
                .catch(error => {
                    console.error('Error restarting camera:', error);
                    alert('Error restarting camera');
                });
            }
        });
        
        // Update tracking button state on load
        fetch('/get_stats')
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    const btn = document.getElementById('toggleTracking');
                    btn.textContent = `Tracking: ${data.track_enabled ? 'ON' : 'OFF'}`;
                }
            });
    </script>
</body>
</html>
